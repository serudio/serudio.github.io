<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="GAmVZrYJ96zd-lgRZy8cckjpQuHlv6maPywwdhtdoYg" />

    <title>__DEFAULT_TITLE__</title>
    <meta name="description" content="__DEFAULT_DESCRIPTION__" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!--
      SEO NOTE: this is a client-rendered React SPA. Non-JS crawlers and
      social share bots (Facebook/Twitter/LinkedIn link previews, etc.)
      only ever read this static HTML file — they do not execute
      src/components/Seo.tsx (react-helmet-async). So keep everything
      below accurate for the HOME page at all times; per-route overrides
      in <Seo /> are a bonus for real browsers and JS-rendering crawlers
      only. Full checklist: see CLAUDE.md, section "SEO".
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__DEFAULT_TITLE__" />
    <meta property="og:description" content="__DEFAULT_DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="uk_UA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__DEFAULT_TITLE__" />
    <meta name="twitter:description" content="__DEFAULT_DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "__SITE_NAME__",
        "url": "__SITE_URL__/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      ADSENSE NOTE: client/publisher id below comes from
      src/config/site.ts (ADSENSE_CLIENT_ID) and must always match
      public/ads.txt. Add real ad units with <AdSlot /> (see
      src/components/AdSlot.tsx) — never hand-roll another
      <ins class="adsbygoogle"> element or a second loader script.
      Full checklist: see CLAUDE.md, section "AdSense".
    -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=__ADSENSE_CLIENT_ID__"
      crossorigin="anonymous"></script>
  </body>
</html>
